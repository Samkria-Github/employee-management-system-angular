<div class="page_wrap">
    <div class="page_title hd_3">
        <h1>Employee Details</h1>
    </div>
    @let employee = empData();
        <div class="page_card">
            <div class="view_page">
                <div class="gap_p">
                    <div class="w_100">
                        <div class="w_33">
                            <h6>User Image</h6>
                            <figure class="image_view circle">
                                <img alt="" [src]="employee?.imageUrl || 'assets/images/profile.png'">
                            </figure>
                        </div>
                    </div>
                    <div class="w_33">
                        <h6>Name</h6>
                        <p>{{employee?.name}}</p>
                    </div>
                    <div class="w_33">
                        <h6>Email</h6>
                        <p>{{employee?.email}}</p>
                    </div>
                    <div class="w_33">
                        <h6>Date of Birth</h6>
                        <p>{{employee?.dob | date: 'dd/MM/yyyy'}}</p>
                    </div>
                    <div class="w_33">
                        <h6>Department</h6>
                        <p>{{employee?.department}}</p>
                    </div>
                     <div class="w_33">
                        <h6>Status</h6>
                        <p>{{employee?.status ? 'Active' : 'In-Active'}}</p>
                    </div>
                </div>
            </div>
        </div>
    
</div>
